{% extends "base.html" %}{% block content %}
<div class="login-wrap">
  <div class="logo"><div class="mark"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#008751" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.7 2.6 4 5.6 4 9s-1.3 6.4-4 9c-2.7-2.6-4-5.6-4-9s1.3-6.4 4-9z"/></svg></div>
    <h1 style="font-size:22px;color:var(--dark)">Smart Campus Connect</h1>
    <p class="muted">Sign in on the campus network - no internet account needed.</p>
  </div>
  <div class="card">
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post">
      <input type="hidden" name="csrf" value="{{ csrf_token }}">
      <label>Username</label><input name="username" required autofocus>
      <label>Password</label><input name="password" type="password" required>
      <div style="margin-top:16px"><button type="submit" style="width:100%">Sign in</button></div>
    </form>
  </div>
</div>
{% endblock %}
